# File → Factory Studio — nginx site config for a dedicated demo host.
#
#   https://dashboard.datab.at   (placeholder until DNS exists)
#
# WAITING BFF: /api/app, /api/parts, /api/plyworks proxy to Flask stand-ins.
# /api/chat is the temporary concierge (server.py). Replace all of /api with
# the Platform BFF when it exists.
#
# This file is NOT copied by the deploy workflow — deliberately, so a deploy
# can never clobber a change certbot made. Installing it is a manual step:
#
#   sudo cp deploy/nginx-dashboard.conf /etc/nginx/sites-available/dashboard
#   sudo ln -s /etc/nginx/sites-available/dashboard /etc/nginx/sites-enabled/dashboard
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dashboard.datab.at
#
# Ship port 80 only until the certificate exists.
#
# `nginx -t` before the reload is not optional: a syntax error in a reloaded
# config takes the site down.

server {
    listen 80;
    server_name dashboard.datab.at;

    root /opt/dashboard/hackaton26-frontend/app/dist;
    index index.html;

    # Do not use a `types {}` block here — it replaces mime.types for this server.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA login is a fixture. This is the gate in front of Flask/Compute spend.
    #   sudo htpasswd -c /etc/nginx/.htpasswd <user>
    auth_basic "File to Factory";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 100M;

    # Longest prefix first — same order as app/vite.config.ts.
    # Prefix locations require a trailing slash. 308 keeps POST (produce/solve).
    location = /api/plyworks { return 308 /api/plyworks/; }
    location = /api/parts { return 308 /api/parts/; }
    location = /api/app { return 308 /api/app/; }

    location /api/plyworks/ {
        include /etc/nginx/snippets/dashboard-proxy-plyworks.conf;
        proxy_pass http://13.51.215.205/api/;
        proxy_http_version 1.1;
        # changeOrigin equivalent — Flask vhosts key off their own Host, not ours.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/parts/ {
        include /etc/nginx/snippets/dashboard-proxy-parts.conf;
        proxy_pass http://13.53.147.114/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/app/ {
        include /etc/nginx/snippets/dashboard-proxy-boxout.conf;
        proxy_pass http://16.170.122.200/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Liveness, unauthenticated so the deploy poll can probe it.
    location = /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
