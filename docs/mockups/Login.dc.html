<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/organic-b58540ab-ae59-445d-a1c5-9610ccaf8e79/styles.css">
  <script src="_ds/organic-b58540ab-ae59-445d-a1c5-9610ccaf8e79/_ds_bundle.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
    html,body{margin:0;padding:0;background:#f8f9fa;}
    a{color:#174ea6;text-decoration:none;}
    a:hover{color:#1a73e8;}
    input:focus-visible,button:focus-visible{outline:2px solid var(--deep);outline-offset:3px;}
    @keyframes f2f-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
</helmet>

<div style="{{ rootStyle }}">
  <div style="{{ wrapStyle }}">

    <div style="{{ brandStyle }}">
      <img src="datab_logo.png" alt="datab" style="height:56px;width:auto;display:block;filter:var(--logo-filter);" />
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="font-weight:600;font-size:30px;letter-spacing:-0.02em;line-height:1;color:var(--ink);">FILE&nbsp;<span style="color:var(--deep);">&rarr;</span>&nbsp;FACTORY</div>
        <div style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);">Manufacturing as a service</div>
      </div>
    </div>

    <div style="{{ cardStyle }}">
      <div style="font-weight:600;font-size:29px;letter-spacing:-0.025em;line-height:1.08;color:var(--deep);">Sign in</div>
      <div style="font-size:15px;line-height:1.55;color:var(--muted);margin:11px 0 26px;">Your company is recognised from your email domain, and your role is the one your administrator assigned. Neither is chosen here.</div>

      <label style="{{ labelStyle }}">Work email</label>
      <input type="text" value="{{ email }}" onInput="{{ setEmail }}" onKeyDown="{{ onKey }}" placeholder="name@company.example" style="{{ inputStyle }}" />

      <label style="{{ labelStyle }}">Password</label>
      <input type="password" value="{{ password }}" onInput="{{ setPassword }}" onKeyDown="{{ onKey }}" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" style="{{ inputStyle }}" />

      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="{{ errorStyle }}">{{ error }}</div>
      </sc-if>

      <button onClick="{{ signIn }}" style="{{ signInStyle }}">Sign in</button>

      <div style="{{ demoWrapStyle }}">
        <div style="{{ labelStyle }}">Provisioned test accounts</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <sc-for list="{{ demoAccounts }}" as="d" hint-placeholder-count="5">
            <button onClick="{{ d.on }}" style="{{ d.style }}">
              <span style="display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;">
                <span style="font-size:13.5px;font-weight:600;">{{ d.email }}</span>
                <span style="font-size:11.5px;color:var(--muted);">{{ d.company }}</span>
              </span>
              <span style="{{ d.tagStyle }}">{{ d.role }}</span>
            </button>
          </sc-for>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:13px;">Mockup — any password is accepted.</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-top:26px;">
      <span style="width:7px;height:7px;border-radius:50%;background:var(--accent);animation:f2f-pulse 2.4s ease-in-out infinite;"></span>
      Decentralized network online
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;}}">
class Component extends DCLogic {
  state = { email: '', password: '', error: '', mode: 'bright', checked: false };

  SESSION_KEY = 'f2f.session';
  OVERRIDE_KEY = 'f2f.roleOverrides';
  HOME = 'F2F Mockup Clay.dc.html';

  brightBase = { surface: '#ffffff', ink: '#202124', muted: '#5f6368', line: '#dadce0', bg: '#f8f9fa' };
  darkPalette = { bg: '#202124', surface: '#292a2d', ink: '#e8eaed', muted: '#9aa0a6', line: '#3c4043' };
  accent = { accent: '#f9ab00', deep: '#7a4a00', darkAccent: '#fdd663' };

  ROLES = { member: 'Member', operator: 'Operator', admin: 'Admin' };
  DOMAINS = { 'frischeis.example': 'A', 'strabag.example': 'B', 'peri.example': 'C' };
  COMPANIES = {
    A: { short: 'Company A', name: 'Frischeis Holzwerk' },
    B: { short: 'Company B', name: 'Strabag Formwork' },
    C: { short: 'Company C', name: 'Peri Systems' }
  };
  DIRECTORY = [
    { email: 'lena@frischeis.example',   name: 'Lena Frischeis', role: 'admin',    by: 'DataB' },
    { email: 'tobias@frischeis.example', name: 'Tobias Reiter',  role: 'operator', by: 'lena@frischeis.example' },
    { email: 'marie@frischeis.example',  name: 'Marie Gruber',   role: 'operator', by: 'lena@frischeis.example' },
    { email: 'jonas@frischeis.example',  name: 'Jonas Weber',    role: 'member',   by: 'lena@frischeis.example' },
    { email: 'klaus@strabag.example',    name: 'Klaus Berger',   role: 'admin',    by: 'DataB' },
    { email: 'sandra@strabag.example',   name: 'Sandra Hofer',   role: 'operator', by: 'klaus@strabag.example' },
    { email: 'peter@strabag.example',    name: 'Peter Mayr',     role: 'member',   by: 'klaus@strabag.example' },
    { email: 'iris@peri.example',        name: 'Iris de Vries',  role: 'admin',    by: 'DataB' },
    { email: 'ruben@peri.example',       name: 'Ruben Bakker',   role: 'member',   by: 'iris@peri.example' }
  ];

  componentDidMount(){
    /* already signed in → straight to the chat */
    let existing = null;
    try {
      const raw = localStorage.getItem(this.SESSION_KEY);
      const s = raw ? JSON.parse(raw) : null;
      if (s && this.ROLES[s.role] && this.COMPANIES[s.company] && this.lookup(s.email)) existing = s;
    } catch (e) {}
    if (existing) { window.location.replace(this.HOME); return; }
    this.setState({ checked: true });
  }

  lookup(email){
    const key = String(email || '').trim().toLowerCase();
    return this.DIRECTORY.find(u => u.email === key) || null;
  }

  companyOf(email){
    const domain = String(email || '').trim().toLowerCase().split('@')[1];
    return domain ? (this.DOMAINS[domain] || null) : null;
  }

  roleOf(user){
    let o = {};
    try { o = JSON.parse(localStorage.getItem(this.OVERRIDE_KEY) || '{}') || {}; } catch (e) {}
    return (user.role !== 'admin' && o[user.email]) ? o[user.email] : user.role;
  }

  signIn = () => {
    const email = (this.state.email || '').trim().toLowerCase();
    if (!email) { this.setState({ error: 'Enter your work email address.' }); return; }
    if (email.indexOf('@') === -1) { this.setState({ error: 'That does not look like an email address.' }); return; }
    if (!this.state.password) { this.setState({ error: 'Enter your password.' }); return; }
    const company = this.companyOf(email);
    if (!company) { this.setState({ error: 'That domain is not registered with DataB. Ask your administrator to onboard it.' }); return; }
    const user = this.lookup(email);
    if (!user) { this.setState({ error: 'No account for this address at ' + this.COMPANIES[company].name + '. Ask your company admin for an invite.' }); return; }
    const session = { email: user.email, name: user.name, company, role: this.roleOf(user), by: user.by, since: Date.now() };
    try { localStorage.setItem(this.SESSION_KEY, JSON.stringify(session)); } catch (e) {}
    window.location.href = this.HOME;
  };

  renderVals(){
    const dark = this.state.mode === 'dark';
    const b = dark ? this.darkPalette : this.brightBase;
    const pal = {
      bg: b.bg, surface: b.surface, ink: b.ink, muted: b.muted, line: b.line,
      accent: dark ? this.accent.darkAccent : this.accent.accent,
      deep: dark ? this.accent.darkAccent : this.accent.deep,
      bad: dark ? '#f28b82' : '#c5221f'
    };
    const face = dark ? '#292a2d' : '#ffffff';
    const face2 = dark ? '#35363a' : '#ffffff';
    const hi = dark ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.95)';
    const lo = dark ? 'rgba(0,0,0,0.46)' : 'rgba(60,64,67,0.16)';
    const drop = dark ? 'rgba(0,0,0,0.54)' : 'rgba(60,64,67,0.20)';
    const clayOut = '14px 18px 34px ' + drop + ', 3px 5px 10px ' + drop;
    const clayIn = 'inset 5px 5px 11px ' + hi + ', inset -6px -8px 14px ' + lo;
    const clayPress = 'inset 7px 8px 15px ' + lo + ', inset -4px -4px 10px ' + hi;
    const tint = (hex, alpha) => {
      const h = hex.replace('#', '');
      const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
      return 'rgba(' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',') + ',' + alpha + ')';
    };

    return {
      rootStyle: {
        '--bg': pal.bg, '--surface': pal.surface, '--ink': pal.ink, '--muted': pal.muted,
        '--line': pal.line, '--accent': pal.accent, '--deep': pal.deep,
        '--logo-filter': dark ? 'invert(1)' : 'none',
        minHeight: '100vh', background: pal.bg, color: pal.ink,
        fontFamily: "'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif",
        display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '44px 24px'
      },
      wrapStyle: { width: '100%', maxWidth: '470px', display: 'flex', flexDirection: 'column', alignItems: 'center' },
      brandStyle: {
        display: 'flex', alignItems: 'center', gap: '20px', padding: '16px 26px 16px 18px', marginBottom: '28px',
        borderRadius: '26px', background: 'linear-gradient(145deg, ' + face2 + ', ' + face + ')',
        boxShadow: clayOut + ', ' + clayIn
      },
      cardStyle: {
        width: '100%', borderRadius: '28px', padding: '32px 32px 28px',
        background: 'linear-gradient(145deg, ' + face2 + ', ' + face + ')',
        boxShadow: clayOut + ', ' + clayIn
      },
      labelStyle: {
        display: 'block', fontSize: '10.5px', fontWeight: 600, letterSpacing: '0.14em',
        textTransform: 'uppercase', color: pal.muted, marginBottom: '10px'
      },
      inputStyle: {
        width: '100%', font: 'inherit', fontSize: '15px', color: pal.ink, outline: 'none', border: 'none',
        background: 'linear-gradient(145deg, ' + (dark ? '#232427' : '#f1f3f4') + ', ' + (dark ? '#2b2c30' : '#ffffff') + ')',
        boxShadow: clayPress, borderRadius: '999px', padding: '15px 20px', marginBottom: '20px'
      },
      errorStyle: {
        fontSize: '13.5px', lineHeight: 1.5, color: pal.bad, background: tint(pal.bad, 0.10),
        borderRadius: '16px', padding: '13px 16px', marginBottom: '20px', boxShadow: clayPress
      },
      signInStyle: {
        width: '100%', font: 'inherit', fontSize: '16px', fontWeight: 700, color: '#fff', cursor: 'pointer',
        border: 'none', borderRadius: '18px', padding: '16px', background: pal.deep,
        boxShadow: '8px 10px 20px ' + drop + ', inset 2px 2px 5px rgba(255,255,255,0.28), inset -3px -4px 9px rgba(0,0,0,0.22)'
      },
      demoWrapStyle: { marginTop: '28px', paddingTop: '24px', borderTop: '1px solid ' + pal.line },
      email: this.state.email,
      password: this.state.password,
      setEmail: (e) => this.setState({ email: e.target.value, error: '' }),
      setPassword: (e) => this.setState({ password: e.target.value, error: '' }),
      onKey: (e) => { if (e.key === 'Enter') this.signIn(); },
      signIn: this.signIn,
      error: this.state.error,
      hasError: !!this.state.error,
      demoAccounts: [this.DIRECTORY[0], this.DIRECTORY[1], this.DIRECTORY[3], this.DIRECTORY[4], this.DIRECTORY[8]].map(u => {
        const role = this.roleOf(u);
        const co = this.COMPANIES[this.companyOf(u.email)];
        return {
          email: u.email, role: this.ROLES[role], company: co.name,
          on: () => this.setState({ email: u.email, password: 'demo', error: '' }),
          style: {
            display: 'flex', alignItems: 'center', gap: '12px', width: '100%',
            font: 'inherit', color: pal.ink, cursor: 'pointer', padding: '12px 15px', borderRadius: '16px',
            border: 'none', background: 'linear-gradient(145deg, ' + (dark ? '#232427' : '#f8f9fa') + ', ' + face + ')',
            boxShadow: clayPress
          },
          tagStyle: {
            marginLeft: 'auto', fontSize: '10px', fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase',
            whiteSpace: 'nowrap', borderRadius: '999px', padding: '5px 11px',
            color: role === 'admin' ? '#fff' : pal.ink,
            background: role === 'admin' ? pal.deep : tint(dark ? '#9aa0a6' : '#5f6368', 0.13)
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
